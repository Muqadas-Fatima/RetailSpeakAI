services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: retailspeak
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Placeholder for the primary LLM (Qwen-2.5-7B-Instruct via vLLM,
  # TDD §2.5, §14). This environment cannot host a GPU-backed vLLM server,
  # so this service is commented out — point LLM_PRIMARY_BASE_URL at your
  # own vLLM deployment, or leave it unreachable to force the Groq
  # fallback path on every call during local dev.
  #
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: ["--model", "Qwen/Qwen2.5-7B-Instruct"]
  #   ports:
  #     - "8001:8000"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/retailspeak
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
