<!doctype html>
<!--
  NEW — Dispatch Center. Not in original Phase 4 scope. Two panels are
  wired to real data: "Ready for pickup" (warehouse-stage's
  /pick-lists?status=ready) and each dispatched order's rider (orchestrator's
  /orders, which already carries rider_id per TDD §4.4's assign step).

  There is no store-wide "list all riders" endpoint yet — delivery-stage
  only exposes /assignments/{rider_id} for a single rider (TDD §4.4).
  The roster + map below use the same fixture riders already checked
  into delivery-stage/_rider_fixtures.py (same ids, names, coordinates)
  rather than invented data, but they render as a static illustration
  here, not a live feed — swap loadRoster() for a real GET across all
  riders once that endpoint exists.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RetailSpeak — Dispatch Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d17; --panel:#131829; --raised:#1b2138; --border:#242b45; --border-soft:#1c2238;
    --text:#eef1fb; --text-dim:#9aa1bc; --text-faint:#616a8c;
    --cyan:#2fe3d6; --cyan-dim:#2fe3d61a; --gold:#f4b942; --gold-dim:#f4b9421a;
    --good:#34d399; --good-dim:#34d3991a; --bad:#f87171; --bad-dim:#f871711a; --violet:#8b7cf6;
    --radius:14px; --shadow:0 10px 30px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:
      radial-gradient(1100px 520px at 85% -10%, #16214a55, transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',-apple-system,sans-serif; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; }

  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border-soft); background:#0a0d17cc; backdrop-filter:blur(10px); position:sticky; top:0; z-index:6; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--cyan),var(--violet)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#081019; font-size:13px; }
  .brand h1{ font-size:16px; margin:0; }
  .tabs{ display:flex; gap:4px; background:var(--raised); padding:4px; border-radius:11px; font-size:12.5px; }
  .tabs span{ padding:7px 13px; border-radius:8px; color:var(--text-dim); cursor:default; }
  .tabs span.active{ background:#232a49; color:var(--text); font-weight:600; }
  .live{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); background:var(--raised); border:1px solid var(--border); padding:6px 12px; border-radius:999px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-dim); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  .layout{ display:grid; grid-template-columns:300px 1fr 300px; gap:16px; padding:20px 24px 40px; max-width:1500px; margin:0 auto; align-items:start; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border-soft); }
  .panel-head h3{ font-size:13.5px; margin:0; font-weight:600; }
  .panel-head .count{ font-size:11px; color:var(--text-faint); background:var(--raised); padding:2px 8px; border-radius:999px; }
  .panel-body{ padding:12px 14px; max-height:560px; overflow-y:auto; }
  .empty{ color:var(--text-faint); font-size:12.5px; padding:20px 4px; text-align:center; }

  .subtabs{ display:flex; gap:4px; padding:10px 14px 0; font-size:11.5px; }
  .subtabs span{ padding:5px 10px; border-radius:7px; color:var(--text-faint); }
  .subtabs span.active{ background:var(--raised); color:var(--text); }

  .order-item{ padding:10px 10px; border-radius:10px; margin-bottom:6px; border:1px solid var(--border-soft); }
  .order-item .ot{ font-size:12.5px; font-weight:700; }
  .order-item .om{ font-size:11px; color:var(--text-faint); margin-top:3px; }

  .rider-card{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:11px; margin-bottom:7px; border:1px solid var(--border-soft); }
  .rider-card .av{ width:34px; height:34px; border-radius:10px; background:var(--raised); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; position:relative; }
  .rider-card .av .pulse-dot{ position:absolute; bottom:-1px; right:-1px; width:9px; height:9px; border-radius:50%; border:2px solid var(--panel); }
  .rider-card .av .pulse-dot.avail{ background:var(--good); }
  .rider-card .av .pulse-dot.transit{ background:var(--gold); }
  .rider-card .av .pulse-dot.off{ background:var(--text-faint); }
  .rider-card .name{ font-size:12.5px; font-weight:700; }
  .rider-card .st{ font-size:11px; color:var(--text-faint); margin-top:1px; }

  .mapcard{ min-height:520px; position:relative; overflow:hidden; }
  .maparea{ position:relative; height:460px; margin:14px; border-radius:12px; overflow:hidden;
    background:
      linear-gradient(#1c2340 1px, transparent 1px) 0 0/34px 34px,
      linear-gradient(90deg,#1c2340 1px, transparent 1px) 0 0/34px 34px,
      #10142399; }
  .pin{ position:absolute; width:26px; height:26px; border-radius:50% 50% 50% 0; transform:translate(-50%,-100%) rotate(-45deg); display:flex; align-items:center; justify-content:center; font-size:11px; box-shadow:0 4px 10px rgba(0,0,0,.4); }
  .pin span{ transform:rotate(45deg); }
  .pin.store{ background:var(--violet); }
  .pin.avail{ background:var(--good); }
  .pin.transit{ background:var(--gold); }
  .route-line{ position:absolute; height:2px; background:repeating-linear-gradient(90deg,var(--cyan) 0 6px, transparent 6px 11px); transform-origin:left center; opacity:.8; }

  .btn{ border:none; border-radius:9px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:linear-gradient(135deg,var(--cyan),#22b8ae); color:#03201c; width:calc(100% - 28px); margin:0 14px 14px; padding:12px; font-size:13px; }

  .zonebar{ display:flex; gap:6px; padding:10px 14px; flex-wrap:wrap; border-top:1px solid var(--border-soft); }
  .zonebar .z{ font-size:11px; padding:5px 10px; border-radius:999px; background:var(--raised); color:var(--text-dim); }

  @media (max-width:1150px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><div class="mark">R</div><h1>Dispatch Center</h1></div>
  <div class="tabs"><span class="active">Riders</span><span>Active Orders</span><span>Zones</span><span>Vehicles</span></div>
  <div class="live"><span class="dot"></span><span>Lahore · store 0001</span></div>
</header>

<div class="layout">
  <!-- Left: Riders (roster) -->
  <div class="panel">
    <div class="panel-head"><h3>All Riders</h3><span class="count" id="riderCount">0/0 Active</span></div>
    <div class="panel-body" id="riderList"></div>
  </div>

  <!-- Center: Live map -->
  <div class="panel mapcard">
    <div class="panel-head"><h3>Live Map</h3><span class="count">Lahore Umar</span></div>
    <div class="maparea" id="mapArea"></div>
    <div class="zonebar"><span class="z">Gulberg</span><span class="z">DHA Phase 5</span><span class="z">Johar Town</span><span class="z">Model Town</span></div>
  </div>

  <!-- Right: Ready / assignment queues -->
  <div class="panel">
    <div class="panel-head"><h3>Active Orders</h3><span class="count" id="orderCount">0</span></div>
    <div class="subtabs"><span class="active">Ready for Dispatch</span><span>Scheduled</span><span>Blocked</span></div>
    <div class="panel-body" id="readyList" style="max-height:380px;"></div>
    <button class="btn primary" onclick="loadAll()">Batch Route · Refresh</button>
  </div>
</div>

<script>
const CONFIG = {
  warehouseBase: "http://localhost:8003",
  orchestratorBase: "http://localhost:8001",
};
const STORE_ID = "00000000-0000-0000-0000-000000000001";

// Real dev fixtures from delivery-stage/_rider_fixtures.py — same ids,
// names and coordinates, but this list is fetched from nowhere: there's
// no all-riders endpoint yet (see file header). Statuses below are
// illustrative; loadOrders() below is what's actually live.
const ROSTER = [
  { id:"...101", name:"Rider Ali",  lat:24.8607, lng:67.0011, status:"avail" },
  { id:"...102", name:"Rider Bilal",lat:24.8700, lng:67.0300, status:"transit" },
  { id:"...103", name:"Rider Sana", lat:24.8500, lng:66.9950, status:"off" },
];
const STORE_PIN = { lat:24.8615, lng:67.0100 };

function project(lat, lng, w, h){
  // crude local-area equirectangular projection, good enough for a
  // small illustrative map, not for real navigation.
  const latSpan = 0.035, lngSpan = 0.055;
  const x = ((lng - (STORE_PIN.lng - lngSpan/2)) / lngSpan) * w;
  const y = h - ((lat - (STORE_PIN.lat - latSpan/2)) / latSpan) * h;
  return { x: Math.max(16,Math.min(w-16,x)), y: Math.max(16,Math.min(h-16,y)) };
}

function renderRoster(){
  const list = document.getElementById("riderList");
  const activeCount = ROSTER.filter(r=>r.status!=="off").length;
  document.getElementById("riderCount").textContent = `${activeCount}/${ROSTER.length} Active`;
  const icons = { avail:"🟢", transit:"🟡", off:"⚪" };
  const labels = { avail:"Available", transit:"In transit", off:"Offline" };
  list.innerHTML = ROSTER.map(r => `
    <div class="rider-card">
      <div class="av">🛵<span class="pulse-dot ${r.status}"></span></div>
      <div><div class="name">${r.name}</div><div class="st">${labels[r.status]}</div></div>
    </div>
  `).join("");
}

function renderMap(){
  const map = document.getElementById("mapArea");
  const w = map.clientWidth || 420, h = map.clientHeight || 460;
  const storeXY = project(STORE_PIN.lat, STORE_PIN.lng, w, h);
  let html = `<div class="pin store" style="left:${storeXY.x}px; top:${storeXY.y}px"><span>🏬</span></div>`;
  ROSTER.forEach(r => {
    if (r.status === "off") return;
    const xy = project(r.lat, r.lng, w, h);
    const dx = xy.x - storeXY.x, dy = xy.y - storeXY.y;
    const len = Math.sqrt(dx*dx+dy*dy), ang = Math.atan2(dy,dx) * 180/Math.PI;
    if (r.status === "transit") {
      html += `<div class="route-line" style="left:${storeXY.x}px; top:${storeXY.y}px; width:${len}px; transform:rotate(${ang}deg)"></div>`;
    }
    html += `<div class="pin ${r.status==='avail'?'avail':'transit'}" style="left:${xy.x}px; top:${xy.y}px"><span>🛵</span></div>`;
  });
  map.innerHTML = html;
}

async function loadReadyOrders(){
  try {
    const res = await fetch(`${CONFIG.warehouseBase}/internal/warehouse/pick-lists?status=ready`);
    const lists = await res.json();
    const list = document.getElementById("readyList");
    document.getElementById("orderCount").textContent = lists.length;
    if (!lists.length) { list.innerHTML = '<div class="empty">Nothing ready for dispatch right now.</div>'; return; }
    list.innerHTML = lists.map(pl => `
      <div class="order-item">
        <div class="ot">Order ${pl.order_id.slice(0,8)}</div>
        <div class="om">pick list ${pl.pick_list_id.slice(0,8)} · ready for pickup</div>
      </div>
    `).join("");
  } catch(e) {
    document.getElementById("readyList").innerHTML = '<div class="empty">Couldn\'t reach warehouse-stage — is it running on :8003?</div>';
  }
}

async function loadAll(){
  renderRoster();
  renderMap();
  await loadReadyOrders();
}

window.addEventListener("resize", renderMap);
loadAll();
</script>
</body>
</html>
